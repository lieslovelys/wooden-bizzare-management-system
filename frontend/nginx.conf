# Reverse-proxy + static-file service for the compose stack (see docker-compose.yml at the repo
# root). "backend" resolves via Docker Compose's internal DNS to the backend service/container.

# Same limit as backend/src/server.js's express.json({ limit: '10mb' }) (profile-photo
# uploads) — Nginx's own 1m default would otherwise reject those requests before they ever
# reach the app.
client_max_body_size 10m;

server {
    listen 80;
    server_name _;

    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # server.js's `trust proxy` setting (P1a) reads this to decide `secure` cookie
        # behavior correctly once TLS terminates here instead of at the app.
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Infrastructure endpoints, deliberately kept outside the /api/ namespace (see
    # ARCHITECTURE_REVIEW.md P1-10) — proxied individually rather than folded into the rule
    # above.
    location = /healthz {
        proxy_pass http://backend:8080/healthz;
    }
    location = /readyz {
        proxy_pass http://backend:8080/readyz;
    }

    root /usr/share/nginx/html;
    index index.html;

    # Long-cache hashed build assets; never cache index.html itself, or a redeploy won't be
    # picked up until the cache expires.
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
