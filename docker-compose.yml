# Deployment target: a single Hostinger KVM 1 VPS (1 vCPU, 4 GB RAM, 50 GB NVMe) — see
# CLAUDE.md and docs/reference_md/ARCHITECTURE_REVIEW.md P1-10/item 42. One vCPU is the binding
# constraint, not RAM/disk: this stack is deliberately four single-replica services, not a
# scaled-out fleet — a second replica of anything here adds scheduling overhead, not
# throughput, on one core.
#
# Reads variables from a root .env — copy .env.example to .env and fill in real values first.
# `backend`/`proxy` pull pre-built images from GHCR by default (IMAGE_TAG, set by CI on deploy —
# see deploy/deploy.sh) so the VPS's single core never has to compile anything; `build:` is kept
# alongside `image:` so a plain `docker compose up -d --build` (local dev, first-time setup, or a
# CI smoke test with no registry access) still works, overriding the pulled image with a local
# build of the same Dockerfile.
#
# TLS is automatic via Caddy (the `proxy` service) once SITE_ADDRESS names a real domain — see
# frontend/Caddyfile. With SITE_ADDRESS unset it defaults to plain HTTP on :80, which is what
# local dev and CI use.

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      # Single source of truth for these three: also what backend/src/config/db.js connects
      # with (see the backend service below).
      POSTGRES_USER: ${SQL_USER}
      POSTGRES_PASSWORD: ${SQL_PASS}
      POSTGRES_DB: ${SQL_DB}
    # P1-2: Postgres's default max_connections (100) reserves more RAM than this plan can
    # spare alongside Node and Caddy on the same 4 GB box.
    command: ["postgres", "-c", "max_connections=30", "-c", "shared_buffers=128MB"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Host-only (not 0.0.0.0) — convenience for manual psql / the backup scripts in deploy/,
      # never exposed externally.
      - "127.0.0.1:${SQL_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SQL_USER} -d ${SQL_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: ghcr.io/strydomph/wbms-backend:${IMAGE_TAG:-latest}
    build:
      context: ./backend/src
    restart: unless-stopped
    environment:
      SQL_USER: ${SQL_USER}
      # Hardcoded, not read from .env: inside the compose network the database is reached by
      # service name, not whatever a human filled in for local (non-Docker) dev.
      SQL_HOST: db
      SQL_PORT: "5432"
      # config/db.js: the stock `postgres:17-alpine` `db` service never has TLS configured, and
      # this link never leaves the compose network's own private bridge — no MITM path for
      # P1-2's cert verification to defend against. Found by item 42's new compose smoke test
      # actually running the stack; see config/db.js's own comment for the full reasoning.
      SQL_SSL: "false"
      SQL_DB: ${SQL_DB}
      SQL_PASS: ${SQL_PASS}
      SECRET_KEY: ${SECRET_KEY}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      # Default false: see server.js and CLAUDE.md — a `secure` cookie is never sent by the
      # browser over plain HTTP, so this must stay true only once SITE_ADDRESS below is a real
      # domain Caddy is actually terminating TLS for.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      PORT: "8080"
      NODE_ENV: production
      # PRD.md C.2 "Storage discipline": worker photos live here instead of inline in Postgres
      # (see backend/src/utils/photoStorage.js) — a named volume rather than a bind mount, so it
      # isn't tied to a path on the host filesystem and backs up/restores the same way `pgdata`
      # does (see deploy/backup.sh's second, uploads-tarball step).
      UPLOAD_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
    # No ports published to the host — only `proxy` needs to reach this, over the internal
    # compose network as http://backend:8080.

  proxy:
    image: ghcr.io/strydomph/wbms-proxy:${IMAGE_TAG:-latest}
    build:
      context: ./frontend
      args:
        # Same-origin deployment: frontend and API are both served through this container, so
        # the shared API client's base URL is empty (relative paths), not a cross-origin host.
        VITE_BACKEND_IP: ""
    restart: unless-stopped
    environment:
      # frontend/Caddyfile: unset (local dev, CI) serves plain HTTP on :80. A real domain here
      # (the VPS's .env) switches Caddy into automatic HTTPS for that domain.
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      DOMAIN: ${DOMAIN:-woodenbizarre.tech}
      # Defaults to the SAME placeholder the Caddyfile itself falls back to — deliberately not
      # empty. Compose substitution always sets this env var in the container even when unset
      # here (as an empty string), and an empty-but-set value breaks the Caddyfile's own
      # `{$PORTAINER_ADDRESS:portainer.invalid}` fallback (which only applies when the variable
      # is truly unset, not when it's set-but-empty) — Caddy then tries to start a listener on a
      # blank site address and crashes outright. Confirmed by a compose run crash-looping with
      # that empty default, while the same image ran fine standalone with no env override at all.
      PORTAINER_ADDRESS: ${PORTAINER_ADDRESS:-portainer.invalid}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      # Persists Caddy's issued certificates and its ACME account across `up`/recreate, so a
      # redeploy doesn't re-request a certificate and risk Let's Encrypt's rate limits.
      - caddy_data:/data
    # Hits Caddy's own admin API (always plain HTTP on 2019, unaffected by whatever TLS/redirect
    # behavior the site itself has under a real SITE_ADDRESS) rather than /healthz through the
    # site — that stays domain/TLS-agnostic between CI's plain-:80 case and the VPS's real-domain
    # case. Without this, `docker compose up --wait` only waited for the container process to
    # start, not for Caddy to actually finish loading its config and bind its listener — a race
    # CI's new compose smoke test (item 42) caught directly (`curl: Connection reset by peer`).
    healthcheck:
      # `curl`, not `wget` — unlike the node:*-alpine image `backend`'s healthcheck runs wget
      # against, the official Caddy Alpine image's own Dockerfile `apk add`s curl specifically
      # (no wget), so curl is the tool this image actually ships. `127.0.0.1`, not `localhost`:
      # Caddy's admin API binds only its IPv4 loopback address, and `localhost` here resolved to
      # `::1` first (musl's getaddrinfo ordering) with nothing listening on it — an immediate,
      # tool-independent `ECONNREFUSED` every single probe, which is why this looked identical
      # (and instant) across wget --spider, wget -qO- and curl in turn before this was found.
      # `start_period` matters here specifically (unlike backend/db's healthchecks, which don't
      # set one): `docker compose up --wait` has a known, unfixed race (docker/compose#12424)
      # where a container's very first failed probe can be reported as "unhealthy" immediately,
      # bypassing `retries` entirely — exactly what every earlier attempt at this healthcheck hit
      # regardless of which HTTP client or address it used, since Caddy genuinely isn't listening
      # yet in the first moment after the container starts. `start_period` gives it real grace
      # time where an early failure doesn't trigger that race.
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      backend:
        condition: service_healthy

  # Container-management GUI for the VPS (item 42) — lets the operator see logs, restart a
  # container, or check resource use from a browser instead of SSH. It has no published port of
  # its own; `proxy` (Caddy) reverse-proxies to it over the compose network at
  # PORTAINER_ADDRESS, with its own automatic HTTPS cert, so it never shares an origin with the
  # app. docker.sock is mounted read-write, which is how Portainer controls the other
  # containers — treat its own admin login as sensitive as root on this VPS.
  portainer:
    image: portainer/portainer-ce:lts
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    # No ports published to the host — only `proxy` needs to reach this, over the internal
    # compose network as http://portainer:9000.

volumes:
  pgdata:
  uploads:
  caddy_data:
  portainer_data:
