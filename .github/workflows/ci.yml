name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/src
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/src/package-lock.json
      - run: npm ci
      # P1-11: vitest + supertest, mocking the model/service layers — no Postgres service
      # container needed here. Real-DB integration tests are a separate, later pass.
      - run: npm test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # P2 (frontend consolidation pass): the ~9 pre-existing lint errors are fixed — see
      # ARCHITECTURE_REVIEW.md P2. Now a real gate. The 3 remaining exhaustive-deps warnings in
      # globals/JobOrderDetails.jsx are deliberately left as warnings (genuine stale-closure
      # smells needing per-effect judgement) and don't fail this step, since `eslint .` only
      # exits non-zero on errors.
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # Item 42 (see ARCHITECTURE_REVIEW.md): builds both images, actually RUNS the compose stack
  # (not just builds it — neither Dockerfile can be built or run in the local dev sandbox they
  # were written in, which has no Docker installed) and smoke-tests it end to end, then — on
  # `main` only — pushes to GHCR for the `deploy` job below to pull.
  images:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    permissions:
      contents: read
      packages: write
    env:
      BACKEND_IMAGE: ghcr.io/strydomph/wbms-backend
      PROXY_IMAGE: ghcr.io/strydomph/wbms-proxy
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend/src
          load: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:latest
      - name: Build proxy image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          load: true
          build-args: |
            VITE_BACKEND_IP=
          tags: |
            ${{ env.PROXY_IMAGE }}:${{ github.sha }}
            ${{ env.PROXY_IMAGE }}:latest

      # Runs the actual stack, the same docker-compose.yml the VPS uses, against the images just
      # built — not a separate hand-rolled `docker run`. DOMAIN is pinned to the reserved
      # .invalid TLD (RFC 2606, same as docker-compose.yml's own PORTAINER_ADDRESS default) so
      # Caddy's automatic-HTTPS attempt for those site blocks fails fast against a domain that
      # can never resolve, instead of risking Let's Encrypt rate limits against the real
      # woodenbizarre.tech from every CI run.
      - name: Write a throwaway .env for the smoke test
        run: |
          cat > .env <<'EOF'
          SQL_USER=wbms_ci
          SQL_PASS=wbms_ci_password
          SQL_DB=wbms_ci
          SECRET_KEY=ci-smoke-test-secret-key-not-real
          ALLOWED_ORIGINS=http://localhost
          COOKIE_SECURE=false
          DOMAIN=example.invalid
          EOF
      # Fast syntax check before the full stack comes up — cheap, and fails faster than waiting
      # on the whole compose bring-up when the Caddyfile itself is the problem.
      - name: Validate the Caddyfile directly against the built image
        run: docker run --rm --entrypoint caddy ${{ env.PROXY_IMAGE }}:${{ github.sha }} validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Bring up the compose stack
        run: IMAGE_TAG=${{ github.sha }} docker compose up -d --wait
      # Asserts on the real response body, not just a 2xx status — a status-only check already
      # missed a real bug once (item 42): a Caddyfile routing mistake made /healthz and /readyz
      # silently fall through to the SPA's index.html, which is also a 200.
      - name: Smoke test through the proxy
        run: |
          [ "$(curl -fsS http://localhost/healthz)" = '{"status":"ok"}' ]
          [ "$(curl -fsS http://localhost/readyz)" = '{"status":"ready"}' ]
          curl -fsS http://localhost/ | grep -q '<div id="root">'
      - name: Compose logs (on failure)
        if: failure()
        run: docker compose logs
      - name: Tear down the compose stack
        if: always()
        run: docker compose down -v

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Push images
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          docker push ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          docker push ${{ env.BACKEND_IMAGE }}:latest
          docker push ${{ env.PROXY_IMAGE }}:${{ github.sha }}
          docker push ${{ env.PROXY_IMAGE }}:latest
      # Private GHCR packages are capped at 500MB on the plan this org is on — each push adds two
      # tags (a sha and `latest`) to each of two packages, so this keeps it from growing forever.
      - name: Prune old image versions
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/delete-package-versions@v5
        with:
          package-name: wbms-backend
          package-type: container
          min-versions-to-keep: 10
      - uses: actions/delete-package-versions@v5
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        with:
          package-name: wbms-proxy
          package-type: container
          min-versions-to-keep: 10

  # Deploys `main` to the VPS by SSHing in and running deploy/deploy.sh, which pulls the images
  # the `images` job above just pushed. Gated on the `DEPLOY_ENABLED` repository variable so this
  # job is a no-op (not a failure) until the VPS is actually set up to receive it — see
  # deploy/README.md. Intentionally a plain `ssh` call rather than a third-party Actions SSH
  # action, to avoid that supply-chain surface for something that can reach production.
  deploy:
    runs-on: ubuntu-latest
    needs: images
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true'
    environment: production
    concurrency:
      group: production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      # The workflow's own short-lived GITHUB_TOKEN is piped into the VPS's `docker login`, so no
      # long-lived registry credential is stored there — it's valid only for this job's duration.
      - name: Deploy
        run: |
          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u ${{ github.actor }} --password-stdin && sh /opt/wbms/deploy/deploy.sh ${{ github.sha }}"
