name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/src/package-lock.json
      - run: npm ci
      # P1-11: vitest + supertest, mocking the model/service layers — no Postgres service
      # container needed here. Real-DB integration tests are a separate, later pass.
      - run: npm test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # P2 (frontend consolidation pass): the ~9 pre-existing lint errors are fixed — see
      # ARCHITECTURE_REVIEW.md P2. Now a real gate. The 3 remaining exhaustive-deps warnings in
      # globals/JobOrderDetails.jsx are deliberately left as warnings (genuine stale-closure
      # smells needing per-effect judgement) and don't fail this step, since `eslint .` only
      # exits non-zero on errors.
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # This job is the real verification for both Dockerfiles in this repo — neither can be
      # built or run in the local dev sandbox they were written in (no Docker installed there).
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend/src
          push: false
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          build-args: |
            VITE_BACKEND_IP=
